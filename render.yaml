# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: marketspike
    runtime: python
    plan: free
    region: frankfurt          # closest Render region to South Africa
    branch: main
    buildCommand: pip install -r requirements.txt && pip install -e .
    # Render injects $PORT at runtime; config.py reads it.
    startCommand: uvicorn marketspike.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MS_SYMBOLS
        value: BTCUSDT
      # Comma-separated origins allowed to call the API from a browser.
      # Add your deployed frontend URL here once you have it.
      - key: MS_CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173
      # The free tier's filesystem is ephemeral: this database is wiped on every
      # deploy and restart. Fine for serving, useless for accumulating training
      # data — record locally instead. See docs/DEPLOY.md.
      - key: MS_DB_PATH
        value: /tmp/marketspike.db
      # EURUSD needs these. Set them in the Render dashboard, never in this file.
      - key: MS_OANDA_TOKEN
        sync: false
      - key: MS_OANDA_ACCOUNT_ID
        sync: false
